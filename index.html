<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dictée flash">
<title>Dictée flash</title>
<!--
  DICTÉE FLASH — v1.1 — style « doux et illustré » (applis élèves de Ludo (@rprof_1))
  Adaptation d'une appli créée par Angelo Malaguarnera avec Gemini. Structure d'origine conservée :
  accueil (mots + rythme + affichage et son) → séance (regarder le mot, puis l'écrire sur la feuille) → correction.
  Ne pas utiliser l'attribut data-theme pour la logique de l'appli (réservé au thème clair/sombre).
  Polices du mot (choix de l'appli d'origine) : chargées depuis Internet. Sans connexion, l'iPad prend une police de secours.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comic+Neue:wght@700&family=Edu+SA+Beginner:wght@600&family=Lexend:wght@600&display=swap" rel="stylesheet">
<style>
/* Marelle et Marelle 2 : cursives officielles (forge apps.education.fr) ; OpenDyslexic : jsDelivr */
@font-face{font-family:'Marelle';src:url('https://marelle.forge.apps.education.fr/fonts/Marelle-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Marelle2';src:url('https://marelle.forge.apps.education.fr/fonts/Marelle2-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/woff/OpenDyslexic-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F8FB; --surface:#EEF1F6; --card:#FFFFFF; --ink:#1F2933; --muted:#6A7581; --line:#E0E5EC; --line-strong:#CDD5DF;
  --focus:#3B6FD8; --primary:#3B6FD8; --primary-ink:#FFFFFF;
  --ok:#22804A; --ok-bg:#E3F5E9; --ok-strong:#2FA05C;
  --bad:#B42A20; --bad-bg:#FCE7E5; --bad-strong:#D9473B;
  --sel:#3B6FD8; --sel-bg:#E6EEFC;
  --p-blue:#DCE9FB; --p-lav:#E7E0FA; --p-peach:#FDE5D3; --p-mint:#DCF1E4; --p-yellow:#FAF0C8; --p-rose:#FADDE3; --p-teal:#D3EFEC; --p-gris:#E6EAF0; /* pastels FIXES : identiques en clair et en sombre, toujours avec --tile-ink */
  --lav-ink:#3C3489; --mint-ink:#27500A; --rose-ink:#72243E; --tile-ink:#1F2933;
  --phase-lecture:#378ADD; --phase-ecriture:#EF9F27;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13181E; --surface:#1F2630; --card:#1A2129; --ink:#ECF0F4; --muted:#A0ABB7; --line:#2C3540; --line-strong:#3A4552;
    --focus:#8AB4F8; --primary:#6F9BF0; --primary-ink:#0F141A;
    --ok:#6FD39A; --ok-bg:#1C3527; --bad:#FF8A80; --bad-bg:#3F201E; --sel:#8AB4F8; --sel-bg:#21324B;
  }
}
:root[data-theme="dark"]{
  --bg:#13181E; --surface:#1F2630; --card:#1A2129; --ink:#ECF0F4; --muted:#A0ABB7; --line:#2C3540; --line-strong:#3A4552;
  --focus:#8AB4F8; --primary:#6F9BF0; --primary-ink:#0F141A;
  --ok:#6FD39A; --ok-bg:#1C3527; --bad:#FF8A80; --bad-bg:#3F201E; --sel:#8AB4F8; --sel-bg:#21324B;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p{margin:0;font-weight:normal}
b,strong{font-weight:normal}

/* ---------- Structure ---------- */
#app{height:100%;display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:14px;padding:12px 16px}
.round{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.round svg{width:24px;height:24px}
.round:disabled{opacity:.35;cursor:default}
#topCenter{min-width:0;display:flex;align-items:center;justify-content:center;gap:10px}
.ttl{font-size:17px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background-color .3s}
.segs i.on{background:var(--primary)}
#main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{zoom:var(--z,1);min-height:calc(100% / var(--z,1));max-width:720px;margin:0 auto;padding:8px 20px 28px;display:flex;flex-direction:column;gap:18px}
.wrap.large{max-width:980px}
.actions{margin-top:auto;padding-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.actions>*{flex:1 1 200px}
.actions.inline{margin-top:0;padding-top:0}
.home-bottom{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.enter{animation:enterR .28s ease-out}
@keyframes enterR{from{opacity:0;transform:translateX(28px)}}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes apparait{from{opacity:0;transform:scale(.94)}}

/* ---------- Textes ---------- */
h1{font-size:clamp(30px,5vw,40px);line-height:1.15;letter-spacing:-.015em}
.lead{font-size:20px;color:var(--muted)}
.q-label{font-size:22px;line-height:1.3}
.small-label{font-size:16px;color:var(--muted)}
.badge{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:15px;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--muted)}

/* ---------- Accueil ---------- */
.hero{display:flex;justify-content:flex-start;margin:4px 0 -6px}
.hero svg{width:min(240px,60%);height:auto}
.slines{display:flex;flex-direction:column;gap:10px}
.sline{display:flex;align-items:center;gap:14px;font-size:20px;line-height:1.35;text-align:left}
.sline .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--p-lav);display:flex;align-items:center;justify-content:center}
.sline .ic svg{width:28px;height:28px}
.sizes{display:flex;flex-direction:column;gap:8px}
.size-pills{display:flex;gap:8px;flex-wrap:wrap}
.size-pill{min-height:46px;padding:0 16px;border-radius:999px;border:0;background:var(--surface);font-size:16px;display:inline-flex;align-items:center;gap:6px}
.size-pill svg{width:20px;height:20px}
.size-pill[aria-pressed="true"]{background:var(--sel-bg);box-shadow:inset 0 0 0 2px var(--sel)}
.foot{margin-top:8px;font-size:13px;line-height:1.6;color:var(--muted);text-align:left}

/* Panneaux de l'accueil : « Mots à mémoriser » et « Réglages du rythme » */
.panel{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:26px;background:var(--card);border:2px solid var(--line)}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:24px;line-height:1.2}
.ph .ic{flex:none;width:48px;height:48px;border-radius:50%;background:var(--p-lav);display:flex;align-items:center;justify-content:center}
.ph .ic svg{width:30px;height:30px}
.count{font-size:16px;padding:4px 12px;border-radius:999px;background:var(--surface);color:var(--muted)}
#mots{width:100%;min-height:220px;padding:14px 18px;border-radius:20px;border:2px solid var(--line-strong);background:var(--card);color:var(--ink);font:20px/1.5 Arial,Helvetica,sans-serif;resize:vertical;-webkit-user-select:text;user-select:text}
#mots::placeholder{color:var(--muted)}
.ligne-bas{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.boutons-mots{display:flex;gap:10px;flex-wrap:wrap}
.btn.petit svg{width:24px;height:24px;vertical-align:-6px;margin-right:6px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .val{min-width:150px;padding:9px 16px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:20px;text-align:center}
/* Choix de la police du mot : chaque bouton montre un exemple dans sa police */
.polices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.police{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:6px 14px;border-radius:20px;border:0;background:var(--surface);color:var(--ink);text-align:left}
.police .pex{font-size:28px;line-height:1.25;letter-spacing:0;font-feature-settings:"calt" 1,"liga" 1}
.police .ptype{font-size:15px;line-height:1.3;color:var(--muted)}
.police[aria-pressed="true"]{background:var(--sel-bg);box-shadow:inset 0 0 0 2px var(--sel)}

/* ---------- Boutons ---------- */
.btn{min-height:58px;padding:0 24px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);font-size:19px;transition:transform .08s}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.petit{flex:none;min-height:48px;padding:0 20px;font-size:17px}
.btn.ic{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.ic svg{flex:none;width:24px;height:24px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- Séance : regarder, puis écrire ---------- */
.seance-haut{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pause-note{display:inline-flex;align-items:center;gap:6px;font-size:15px;padding:5px 12px;border-radius:999px;background:var(--p-yellow);color:var(--tile-ink)}
.pause-note svg{width:16px;height:16px}
.sline .ic.bleu{background:var(--p-blue)}
.sline .ic.jaune{background:var(--p-yellow)}
.consigne{font-size:22px}
.stage{flex:1 1 0;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;border-radius:30px;background:var(--card);border:3px solid var(--line);text-align:center;overflow:hidden}
.stage.lecture{border-color:#85B7EB}
.stage.ecriture{border-color:#FAC775}
.flash-word{display:block;width:100%;font-size:96px;font-family:var(--police-mot,Arial,Helvetica,sans-serif);font-weight:var(--poids-mot,bold);letter-spacing:0;font-feature-settings:"calt" 1,"liga" 1;line-height:1.3;color:var(--ink);overflow-wrap:normal;word-break:normal;-webkit-hyphens:none;hyphens:none;animation:apparait .3s ease-out}
.aide-ecrire{display:flex;flex-direction:column;align-items:center;gap:12px}
.aide-ecrire svg{width:140px;height:auto}
.aide-ecrire p{font-size:26px}
.cache{visibility:hidden}
.temps{flex:none;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.temps i{display:block;height:100%;width:100%;border-radius:99px;background:var(--phase-lecture);transition:width .1s linear}
.temps.ecriture i{background:var(--phase-ecriture)}
.seance-actions{margin-top:0}
.seance-actions .btn{flex:1 1 0;min-width:150px;padding:0 16px}
.stage.verif{border-color:#97C459}
.sline .ic.vert{background:var(--p-mint)}

/* ---------- Correction (fin de séance) ---------- */
.recap{display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:30px;background:var(--card);border:1px solid var(--line)}
.recap-head{display:flex;align-items:center;gap:18px}
.fin-ico{flex:none;width:84px;height:84px;border-radius:50%;background:var(--p-yellow);display:flex;align-items:center;justify-content:center}
.fin-ico svg{width:56px;height:56px}
.liste-mots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.liste-mots li{display:flex;align-items:center;gap:12px;min-width:0;padding:8px 18px 8px 10px;border-radius:26px;background:var(--p-lav);color:var(--lav-ink)}
.liste-mots .num{flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:17px}
.liste-mots .lm{min-width:0;font-size:26px;font-family:var(--police-mot,Arial,Helvetica,sans-serif);font-weight:var(--poids-mot,bold);letter-spacing:0;font-feature-settings:"calt" 1,"liga" 1;line-height:1.3;overflow-wrap:anywhere}
.tip{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:22px;background:var(--p-yellow);color:var(--tile-ink);font-size:19px}
.tip svg{flex:none;width:34px;height:34px}

/* ---------- Aide pas-à-pas ---------- */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(31,41,51,.28)}
.modal.on{display:flex}
.mbox{zoom:var(--z,1);width:min(620px,100%);max-height:calc(100% / var(--z,1));overflow:auto;background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px}
.mtop{display:flex;align-items:center;gap:12px}
.mtop .segs{flex:1}
.mbox h2{font-size:26px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav .btn{min-width:130px}
.etape-n{margin-bottom:-12px}
.etape-titre{font-size:clamp(30px,5vw,40px);line-height:1.15}
.etape-nav{margin-top:auto;padding:10px 0 4px;position:sticky;bottom:0;background:var(--bg);z-index:2}
.etape-nav .btn{flex:1 1 0}
.scount{font-size:16px;color:var(--muted)}

/* Réglages en haut de l'accueil (Style + Taille du texte) */
.reglages{display:flex;flex-wrap:wrap;gap:12px 28px;padding-bottom:4px}
.reglages .size-pill{min-height:44px}
body.simple .hero{display:none}
body.simple .sline .ic,body.simple .ph .ic{background:var(--surface)}
body.simple .size-pill[aria-pressed="true"],body.simple .police[aria-pressed="true"]{color:#FFFFFF;box-shadow:none}
body.simple .police[aria-pressed="true"] .ptype{color:#FFFFFF}
body.simple .panel{border:1.5px solid var(--line)}
body.simple .badge,body.simple .tip,body.simple .fin-ico,body.simple .pause-note{background:var(--surface)}
body.simple .segs i.on{background:#0A0A0A}
body.simple .liste-mots li{background:var(--surface)}
body.simple .liste-mots .num{background:#FFFFFF}
/* Étiquette « Nouveau » à côté du bouton Simple (couleurs fixes, lisibles en clair et en sombre) */
.nouveau{margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;line-height:1.6;background:#FAF0C8;color:#1F2933}
/* Ouverture façon rprof1.com : le titre, puis le point tombe, rebondit et se pose (≈ 1,5 s). */
.ouverture{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.ouverture-mot{max-width:14ch;text-align:center;font-family:"Figtree","Avenir Next",Arial,sans-serif;font-size:clamp(44px,9vw,92px);font-weight:600;letter-spacing:-.045em;line-height:1.02;color:var(--ink)}
.ouverture-point{display:inline-block;transform-origin:50% 85%}
@media (prefers-reduced-motion:reduce){
  .enter,.flash-word{animation:none}
  .segs i,.temps i{transition:none}
}
/* Style « Simple » = charte de rprof1.com : blanc, noir, gris, une seule police (Figtree, incluse).
   Restent en couleur : les pictogrammes (dans un rond blanc), les mots en évidence,

body.simple{
  --bg:#FFFFFF; --surface:#F7F7F7; --card:#FFFFFF; --ink:#0A0A0A; --muted:#737373; --line:#ECECEC; --line-strong:#DCDCDC;
  --focus:#0A0A0A; --primary:#0A0A0A; --primary-ink:#FFFFFF; --sel:#0A0A0A; --sel-bg:#0A0A0A;
  --p-lav:#F7F7F7; --lav-ink:#0A0A0A; --tile-ink:#0A0A0A;
  --ok:#1A7F37; --ok-bg:#E3F5E9; --ok-strong:#1A7F37; --bad:#B42318; --bad-bg:#FCE7E5; --bad-strong:#B42318;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  background:#FFFFFF;color:var(--ink);font-family:"Figtree","Avenir Next",Arial,sans-serif;
  color-scheme:light;
}
body.simple .field input{font-family:inherit}
body.simple h1{font-weight:600;letter-spacing:-.045em;line-height:1}
body.simple .mbox h2,body.simple .sheet-title,body.simple .word{font-weight:600;letter-spacing:-.025em}
body.simple .tile .name{font-weight:600;letter-spacing:-.02em}
body.simple .lead{color:#3C3C3C}
body.simple .hero{display:none}
body.simple .round{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .tile{background:var(--surface)!important;border:0;border-radius:16px}
body.simple .tile .ico{background:#FFFFFF}
body.simple .sline .ic{background:var(--surface)}
body.simple .badge,body.simple .scount,body.simple .foot{font-family:var(--mono);letter-spacing:.03em}
body.simple textarea,body.simple input,body.simple select{font-family:inherit}
body.simple .badge{background:transparent;border:1px solid var(--line-strong);font-size:14px}
body.simple .size-pill{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .size-pill[aria-pressed="true"]{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF;box-shadow:none}
body.simple .btn{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .btn.primary{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF}
body.simple .def-card,body.simple .recap{background:#FFFFFF;border:1px solid var(--line);border-radius:16px}
body.simple .choice:not(.ok):not(.ko):not(.dim),body.simple .choice.dim:not(.ok):not(.ko){background:#FFFFFF;border:1px solid var(--line-strong);color:var(--ink)}
body.simple .choice.ok,body.simple .choice.ko{border-width:2px}
body.simple .tip{background:var(--surface);border-radius:16px}
body.simple .chip.ok{background:var(--ok-bg);color:var(--ok)} body.simple .chip.ko{background:var(--bad-bg);color:var(--bad)}


body.simple .segs i{height:4px} body.simple .segs i.on{background:#0A0A0A}
body.simple .mbox{border-radius:16px}
body.simple .modal{background:rgba(10,10,10,.25)}
/* Réponses en pastel : contours et rond dans les pastels du site, bouton Continuer noir. */
body.simple .choice.ok{border-color:#86CFA4} body.simple .choice.ko{border-color:#F4A3B4}
body.simple .sheet-ico{background:#86CFA4;color:#0A0A0A} body.simple .sheet.bad .sheet-ico{background:#F4A3B4}
body.simple .sheet-btn,body.simple .sheet.bad .sheet-btn{background:#0A0A0A;color:#FFFFFF}
body.simple .streak{background:var(--surface);color:var(--ink)}
.marque{margin:0 0 4px;font-family:"Figtree","Avenir Next",Arial,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--ink)}
</style>

function styleActuel(){return store('style')==='simple'?'simple':'couleurs';}

/* Ouverture façon rprof1.com : le titre s'affiche, le point tombe, rebondit en changeant
   de couleur (pastels du site) et se pose. Une fois par session, sautée au toucher,
   jamais si l'iPad demande moins d'animations ni pendant les tests automatiques. */
function ouverture(){
  let vu=null;try{vu=sessionStorage.getItem(APP.cle+'-ouverture');sessionStorage.setItem(APP.cle+'-ouverture','1');}catch(e){}
  if(vu||!('animate' in Element.prototype)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(navigator.webdriver&&location.hash!=='#ouverture')return;
  const o=document.createElement('div');o.className='ouverture';o.setAttribute('aria-hidden','true');
  o.innerHTML='<span class="ouverture-mot">'+esc(APP.titre)+'<span class="ouverture-point">.</span></span>';
  document.body.appendChild(o);
  const p=o.querySelector('.ouverture-point');let fini=false;
  const fermer=()=>{if(fini)return;fini=true;o.animate([{opacity:1},{opacity:0}],{duration:280,fill:'forwards'}).finished.then(()=>o.remove());};
  ['pointerdown','keydown'].forEach(t=>addEventListener(t,fermer,{once:true,passive:true}));
  const bas='cubic-bezier(.5,0,1,.6)',haut='cubic-bezier(0,.4,.5,1)';
  p.animate([
    {transform:'translateY(-1.7em) scale(.9,1.15)',opacity:0,color:'#B9A7EE',offset:0},
    {transform:'translateY(-1.7em) scale(.9,1.15)',opacity:1,easing:bas,offset:.02},
    {transform:'translateY(0) scale(.9,1.15)',color:'#8FB6EE',offset:.34},
    {transform:'translateY(0) scale(1.35,.68)',easing:haut,offset:.40},
    {transform:'translateY(-.45em) scale(.95,1.08)',color:'#86CFA4',easing:bas,offset:.58},
    {transform:'translateY(0) scale(1.25,.78)',easing:haut,offset:.70},
    {transform:'translateY(-.14em) scale(1,1)',color:'#E9C95E',easing:bas,offset:.80},
    {transform:'translateY(0) scale(1.1,.9)',color:'#F4A3B4',offset:.88},
    {transform:'translateY(0) scale(1,1)',color:getComputedStyle(p).color,offset:1}
  ],{duration:1150,fill:'backwards'});
  setTimeout(fermer,1400);
}
/* Étiquette « Nouveau » sur le bouton Simple (sans animation) : disparaît dès qu'on touche un style, ou après 3 ouvertures. */
const NOUVEAU_SIMPLE=(()=>{const n=store('nouveau-simple')||0;if(n>=0&&n<3)store('nouveau-simple',n+1);return n>=0&&n<3;})();

  if(!b.querySelector('.nouveau'))b.insertAdjacentHTML('beforeend','<span class="nouveau">Nouveau</span>');
  document.querySelectorAll('[data-sty]').forEach(x=>x.addEventListener('click',()=>{store('nouveau-simple',-1);document.querySelectorAll('.nouveau').forEach(e=>e.remove());}));}

/* Données qui survivent aux mises à jour : ne jamais changer APP.cle ni les noms passés à store()
   ('taille', 'style', 'mots', 'lecture', 'ecriture', 'son', 'page', 'police').
   Si le format d'une donnée change, augmenter DONNEES_VERSION et convertir ici. */
const DONNEES_VERSION=1;
function migrerDonnees(){
  const v=Number(store('donnees-version'))||0;
  if(v!==DONNEES_VERSION)store('donnees-version',DONNEES_VERSION);
}
migrerDonnees();

/* Mots : un par ligne, ou séparés par des virgules, des points-virgules ou des tabulations (copie d'Excel).
   Une liste copiée de Word peut garder ses puces ou ses numéros (« • maison », « 1. maison ») : on les enlève. */
function decouper(t){return String(t||'').split(/[\n\r\t,;]+/)
  .map(w=>w.trim().replace(/^(?:[•◦▪·\-–—*]+|\d+[.)])\s*/,'').trim())
  .filter(w=>w&&!/^\d+[.)]?$/.test(w));}
function tirerMots(n){const a=MOTS_BASE.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
function nbMotsTexte(n){return n+(n>1?' mots':' mot');}

/* Réglages de la séance, mémorisés sur l'iPad (valeurs vérifiées : une donnée abîmée reprend la valeur de départ) */
function borne(v,r){v=Math.round((v-r.min)/r.pas)*r.pas+r.min;return Math.min(r.max,Math.max(r.min,v));}
function lireDuree(nom){const v=store(nom);return (typeof v==='number'&&isFinite(v))?borne(v,RYTHME[nom]):RYTHME[nom].defaut;}
const R={
  lecture:lireDuree('lecture'),
  ecriture:lireDuree('ecriture'),
  son:store('son')===true,                       // signal sonore doux : coupé au départ
  page:store('page')==='blanche'?'blanche':'aide',
  police:(()=>{const p=store('police');return POLICES.some(x=>x.id===p)?p:POLICE_DEPART;})(),
  texte:(()=>{const t=store('mots');return typeof t==='string'?t:'';})()      // vide au départ : on colle sa liste
};
/* Police du mot : appliquée au mot de la séance et à la liste de correction */
function appliquerPolice(){
  const p=POLICES.find(x=>x.id===R.police)||POLICES[0];
  document.documentElement.style.setProperty('--police-mot',p.famille);
  document.documentElement.style.setProperty('--poids-mot',String(p.poids));
}
appliquerPolice();
/* Quand une police finit de se charger, la taille du mot est recalculée (les largeurs changent) */
if(document.fonts){try{document.fonts.addEventListener('loadingdone',()=>layout());document.fonts.ready.then(()=>layout());}catch(e){}}

/* Signal sonore doux quand le mot change (si activé). Créé au premier toucher, sinon l'iPad le bloque. */
let actx=null;
function sonPret(){if(!R.son)return;try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function bip(f,type,d,delai){try{const t=actx.currentTime+(delai||0),o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}
function signal(phase){if(!R.son||!actx)return;if(phase==='lecture'){bip(523.25,'sine',.2,0);bip(659.25,'sine',.25,.1);}else bip(440,'triangle',.3,0);}

/* Garder l'écran allumé pendant la séance (iPad récent ; sans effet ailleurs) */
let verrou=null;
async function garderEcranAllume(on){
  try{
    if(on){if(!verrou&&navigator.wakeLock){verrou=await navigator.wakeLock.request('screen');verrou.addEventListener('release',()=>{verrou=null;});}}
    else if(verrou){const v=verrou;verrou=null;await v.release();}
  }catch(e){verrou=null;}
}

  else if(o.title)c='<span class="ttl">'+esc(o.title)+'</span>';

function view(html,large){main.innerHTML='<div class="wrap enter'+(large?' large':'')+'">'+html+'</div>';main.scrollTop=0;layout();}
function line(ic,txt){return '<div class="sline"><span class="ic">'+(ICONS[ic]||'')+'</span><span>'+esc(txt)+'</span></div>';}

    '<span class="small-label">'+esc(conseil)+'</span></div>';}

/* ---------- Préparation en 3 étapes : les mots, le rythme, l'affichage ---------- */
const ETAPES=[
  {titre:'Les mots',ic:'liste',dire:'Colle ou écris tes mots. Ou touche « Mots au hasard ».'},
  {titre:'Le rythme',ic:'sablier',dire:'Choisis le temps pour regarder le mot, puis le temps pour l’écrire.'},
  {titre:'Affichage et son',ic:'police',dire:'Choisis la police du mot et le son. Puis touche « Commencer la dictée ».'}
];
function renderEtape(n,vide){
  quitter();
  const e=ETAPES[n-1];
  header({segs:[n,ETAPES.length],listen:()=>say(e.dire)});
  let corps='';
  if(n===1)corps='<section class="panel" id="panMots">'+
      '<h2 class="ph"><span>Mots à mémoriser</span><span class="count" id="nbMots">'+nbMotsTexte(decouper(R.texte).length)+'</span></h2>'+
      '<label class="small-label" for="mots">Colle ou écris tes mots, un mot par ligne :</label>'+
      '<textarea id="mots" rows="8" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Colle ta liste ici.&#10;Exemple :&#10;château&#10;beaucoup&#10;toujours">'+esc(R.texte)+'</textarea>'+
      '<div class="tip" id="videMsg"'+(vide?'':' hidden')+'>'+ICONS.crayon+'<span>Colle ou écris au moins 1 mot pour continuer.</span></div>'+
      '<div class="ligne-bas"><span class="small-label">Tu peux coller une liste de Word ou d’Excel.</span><span class="boutons-mots"><button type="button" class="btn petit" id="hasardBtn">'+UI.de+'Mots au hasard</button><button type="button" class="btn petit" id="effacerBtn">Effacer tout</button></span></div>'+
    '</section>';
  if(n===2)corps='<section class="panel">'+
      stepper('lecture','Temps pour regarder le mot','Conseil : 4 à 6 secondes.')+
      stepper('ecriture','Temps pour écrire','Laisse assez de temps pour finir d’écrire.')+
    '</section>';
  if(n===3)corps='<section class="panel">'+
      '<div class="sizes"><span class="small-label">Police du mot</span><div class="polices">'+
        POLICES.map(p=>'<button type="button" class="police" data-police="'+p.id+'" aria-pressed="'+(R.police===p.id)+'">'+
          '<span class="pex" style="font-family:'+esc(p.famille)+';font-weight:'+p.poids+'">'+esc(EXEMPLE_POLICE)+'</span>'+
          '<span class="ptype">'+esc(p.nom)+' · '+esc(p.type)+'</span></button>').join('')+
      '</div></div>'+
      pills('Son quand le mot change','data-son',[['1','Oui'],['0','Non']],R.son?'1':'0')+
      pills('Pendant l’écriture','data-page',[['aide','Aide visible'],['blanche','Page toute blanche']],R.page)+
    '</section>';
  view('<p class="small-label etape-n">Étape '+n+' sur '+ETAPES.length+'</p>'+
    '<h1 class="ph etape-titre"><span class="ic">'+ICONS[e.ic]+'</span><span>'+esc(e.titre)+'</span></h1>'+corps+
    '<div class="mnav etape-nav"><button type="button" class="btn" id="retourBtn">Retour</button>'+
    '<button type="button" class="btn primary" id="suiteBtn">'+(n<ETAPES.length?'Suivant':'Commencer la dictée')+'</button></div>');

  $('#retourBtn').addEventListener('click',()=>n>1?renderEtape(n-1):renderHome());
  $('#suiteBtn').addEventListener('click',()=>n<ETAPES.length?(n===1&&!decouper(R.texte).length?renderEtape(1,true):renderEtape(n+1)):lancer());
  const presser=(attr,b)=>$$('['+attr+']',main).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));

  if(n===1){
    const ta=$('#mots',main);
    const majMots=()=>{
      store('mots',R.texte);
      $('#nbMots',main).textContent=nbMotsTexte(decouper(R.texte).length);
      if(decouper(R.texte).length)$('#videMsg',main).hidden=true;
    };
    ta.addEventListener('input',()=>{R.texte=ta.value;majMots();});
    const eff=$('#effacerBtn',main);let effTimer=null;
    eff.addEventListener('click',()=>{
      if(!eff.dataset.ok){eff.dataset.ok='1';eff.textContent='Touche encore pour effacer';clearTimeout(effTimer);
        effTimer=setTimeout(()=>{delete eff.dataset.ok;eff.textContent='Effacer tout';},4000);return;}
      clearTimeout(effTimer);delete eff.dataset.ok;eff.textContent='Effacer tout';
      R.texte='';ta.value='';majMots();
    });
    /* Mots au hasard : remplit le cadre avec NB_HASARD mots du vocabulaire de base */
    const has=$('#hasardBtn',main);let hasTimer=null;
    const hasTexte=has.innerHTML;
    has.addEventListener('click',()=>{
      if(decouper(R.texte).length&&!has.dataset.ok){has.dataset.ok='1';has.textContent='Touche encore pour remplacer';clearTimeout(hasTimer);
        hasTimer=setTimeout(()=>{delete has.dataset.ok;has.innerHTML=hasTexte;},4000);return;}
      clearTimeout(hasTimer);delete has.dataset.ok;has.innerHTML=hasTexte;
      R.texte=tirerMots(NB_HASARD).join('\n');ta.value=R.texte;majMots();
    });
  }
  if(n===2){
    const majRythme=cle=>{
      const r=RYTHME[cle];store(cle,R[cle]);
      $('#val-'+cle,main).textContent=R[cle]+' secondes';
      $('[data-moins="'+cle+'"]',main).disabled=R[cle]<=r.min;
      $('[data-plus="'+cle+'"]',main).disabled=R[cle]>=r.max;
    };
    $$('[data-moins]',main).forEach(b=>b.addEventListener('click',()=>{const c=b.dataset.moins;R[c]=borne(R[c]-RYTHME[c].pas,RYTHME[c]);majRythme(c);}));
    $$('[data-plus]',main).forEach(b=>b.addEventListener('click',()=>{const c=b.dataset.plus;R[c]=borne(R[c]+RYTHME[c].pas,RYTHME[c]);majRythme(c);}));
  }
  if(n===3){
    $$('[data-son]',main).forEach(b=>b.addEventListener('click',()=>{R.son=b.dataset.son==='1';store('son',R.son);presser('data-son',b);if(R.son){sonPret();signal('lecture');}}));
    $$('[data-page]',main).forEach(b=>b.addEventListener('click',()=>{R.page=b.dataset.page;store('page',R.page);presser('data-page',b);}));
    $$('[data-police]',main).forEach(b=>b.addEventListener('click',()=>{R.police=b.dataset.police;store('police',R.police);appliquerPolice();presser('data-police',b);}));
  }
}

/* ---------- Séance : le mot s'affiche, puis disparaît pour être écrit ---------- */
const T={mots:[],i:0,phase:'idle',pause:false,duree:0,reste:0,fin:0,suite:null,timer:null};
function enSeance(){return T.phase==='lecture'||T.phase==='ecriture';}
function enDictee(){return enSeance()||T.phase==='verif';}

function lancer(){
  const mots=decouper(R.texte);
  if(!mots.length){
    renderEtape(1,true);
    return;
  }
  sonPret();
  T.mots=mots;T.i=0;
  garderEcranAllume(true);
  phaseLecture();
}
function phaseLecture(){
  if(T.i>=T.mots.length)return finSeance();
  T.phase='lecture';minuteur(R.lecture*1000,phaseEcriture);renderSeance();signal('lecture');
}
function phaseEcriture(){
  T.phase='ecriture';minuteur(R.ecriture*1000,motSuivant);renderSeance();signal('ecriture');
}
function motSuivant(){T.i++;phaseLecture();}
/* « Vérifier » : le mot revient pour que l'élève compare avec sa feuille (sans minuteur) */
function phaseVerif(){arreter();T.phase='verif';T.pause=false;T.suite=null;renderSeance();say(T.mots[T.i]);}
/* « Retour » : pendant la lecture, mot précédent. Sinon, revoir le mot actuel. */
function reculer(){
  if(T.phase==='lecture'){if(T.i===0)return;T.i--;}
  else if(T.phase!=='ecriture'&&T.phase!=='verif')return;
  phaseLecture();
}

/* Minuteur basé sur l'heure réelle (reste juste même si l'iPad ralentit la page) */
function minuteur(ms,suite){arreter();T.duree=ms;T.reste=ms;T.suite=suite;T.pause=false;demarrer();}
function demarrer(){T.fin=Date.now()+T.reste;T.timer=setInterval(tic,100);}
function arreter(){if(T.timer){clearInterval(T.timer);T.timer=null;}}
function tic(){
  T.reste=Math.max(0,T.fin-Date.now());majBarre();
  if(T.reste<=0){arreter();const s=T.suite;T.suite=null;if(s)s();}
}
function majBarre(){const b=$('#barre',main);if(b)b.style.width=(T.duree?T.reste/T.duree*100:0)+'%';}
function basculerPause(){
  if(!enSeance())return;
  if(T.pause){T.pause=false;demarrer();}
  else{T.reste=Math.max(0,T.fin-Date.now());arreter();T.pause=true;}
  const b=$('#pauseBtn',main);if(b)b.innerHTML=T.pause?UI.play+'Reprendre':UI.pause+'Pause';
  const p=$('#pauseNote',main);if(p)p.hidden=!T.pause;
  majBarre();
}
/* « J'écris » / « Mot suivant » : passe à l'étape suivante, même pendant une pause */
function passer(){if(T.phase==='lecture')phaseEcriture();else if(T.phase==='ecriture'||T.phase==='verif')motSuivant();}
function quitter(){arreter();T.phase='idle';T.pause=false;T.suite=null;garderEcranAllume(false);if(synth)synth.cancel();}

function renderSeance(){
  const lect=T.phase==='lecture',verif=T.phase==='verif',ecr=T.phase==='ecriture',mot=T.mots[T.i],n=T.mots.length,dernier=T.i===n-1,blanche=ecr&&R.page==='blanche';
  const cls=lect?'lecture':verif?'verif':'ecriture';
  header({segs:[T.i,n],listen:()=>say(mot)});
  view('<div class="seance-haut"><span class="badge">Mot '+(T.i+1)+' sur '+n+'</span><span class="pause-note" id="pauseNote"'+(T.pause?'':' hidden')+'>'+UI.pause+'En pause</span></div>'+
    '<div class="sline consigne"><span class="ic '+(lect?'bleu':verif?'vert':'jaune')+'">'+(lect?ICONS.oeil:verif?ICONS.ok:ICONS.crayon)+'</span><span>'+(lect?'Regarde bien le mot.':verif?'Compare avec ta feuille.':'Écris le mot sur ta feuille.')+'</span></div>'+
    '<div class="stage '+cls+'">'+
      (ecr?'<div class="aide-ecrire'+(blanche?' cache':'')+'">'+ICONS.ecrire+'<p>À toi d’écrire !</p></div>'
          :'<span class="flash-word">'+esc(mot)+'</span>')+
    '</div>'+
    (verif?'':'<div class="temps '+cls+(blanche?' cache':'')+'"><i id="barre"></i></div>')+
    '<div class="actions seance-actions">'+
      '<button type="button" class="btn ic" id="reculBtn"'+(lect&&T.i===0?' disabled':'')+'>'+UI.retour+'Retour</button>'+
      (verif?'':'<button type="button" class="btn ic" id="pauseBtn">'+(T.pause?UI.play+'Reprendre':UI.pause+'Pause')+'</button>')+
      (ecr?'<button type="button" class="btn ic" id="verifBtn">'+UI.coche+'Vérifier</button>':'')+
      '<button type="button" class="btn primary ic" id="suivantBtn">'+(lect?'J’écris':dernier?'J’ai fini':'Mot suivant')+UI.fleche+'</button>'+
    '</div>',true);
  $('#reculBtn').addEventListener('click',reculer);
  if(!verif)$('#pauseBtn').addEventListener('click',basculerPause);
  if(ecr)$('#verifBtn').addEventListener('click',phaseVerif);
  $('#suivantBtn').addEventListener('click',passer);
  majBarre();
}

/* ---------- Correction : la liste complète pour corriger sa feuille ---------- */
function finSeance(){quitter();T.phase='fin';renderFin();}
function renderFin(){
  const n=T.mots.length;
  header({title:'Correction',listen:()=>say('Voici les mots. '+T.mots.join('. ')+'.')});
  view('<div class="recap"><div class="recap-head"><span class="fin-ico">'+ICONS.etoile+'</span>'+
      '<div><h1>Séance terminée !</h1><p class="lead">'+(n>1?'Voici les '+n+' mots.':'Voici le mot.')+'</p></div></div>'+
      '<ol class="liste-mots">'+T.mots.map((m,k)=>'<li><span class="num">'+(k+1)+'</span><span class="lm">'+esc(m)+'</span></li>').join('')+'</ol>'+
    '</div>'+
    '<div class="tip">'+ICONS.crayon+'<span>Compare chaque mot avec ta feuille.<br>Corrige tes erreurs.</span></div>'+
    '<div class="actions"><button type="button" class="btn primary" id="againBtn">Recommencer la liste</button><button type="button" class="btn" id="homeBtn2">Accueil</button></div>',true);
  $('#againBtn').addEventListener('click',lancer);
  $('#homeBtn2').addEventListener('click',renderHome);
}

/* Raccourcis clavier (ordinateur du TVI) : Espace = pause, flèches = suivant / retour, Échap = accueil */
addEventListener('keydown',e=>{
  if(!enDictee()||$('#helpModal').classList.contains('on'))return;
  if(e.code==='Space'){if(!enSeance())return;if(e.target.closest&&e.target.closest('button'))return;e.preventDefault();basculerPause();}
  else if(e.code==='ArrowRight'){e.preventDefault();passer();}
  else if(e.code==='ArrowLeft'){e.preventDefault();reculer();}
  else if(e.code==='Escape'){e.preventDefault();renderHome();}
});
/* L'élève quitte l'appli ou l'écran s'éteint : la séance se met en pause */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(enSeance()&&!T.pause)basculerPause();}
  else if(enSeance())garderEcranAllume(true);
});

/* Crochet pour les tests automatiques (invisible pour l'élève) */
window.__appli={etat:()=>({phase:T.phase,i:T.i,mot:T.mots[T.i]||null,mots:T.mots.slice(),pause:T.pause,reste:T.reste,duree:T.duree}),reglages:()=>Object.assign({},R),motsBase:()=>MOTS_BASE.slice(),tirerMots};

/* =====================================================================
   7. AIDE PAS-À-PAS
   ===================================================================== */
const H={i:0,e:[]};
function openHelp(){H.i=0;H.e=etapes();renderHelp();$('#helpModal').classList.add('on');}
function closeHelp(){$('#helpModal').classList.remove('on');}
function renderHelp(){const n=H.e.length,e=H.e[H.i];
  $('#helpSegs').innerHTML=H.e.map((_,k)=>'<i class="'+(k<=H.i?'on':'')+'"></i>').join('');
  $('#helpBody').innerHTML='<h2>'+esc(e.titre)+'</h2><div class="slines" style="margin-top:14px">'+e.lignes.map(l=>line(l[0],l[1])).join('')+'</div>';
  $('#helpCount').textContent='Étape '+(H.i+1)+' sur '+n;
  $('#helpPrev').style.visibility=H.i?'visible':'hidden';
  $('#helpNext').textContent=H.i===n-1?'J’ai compris':'Suivant';}
function helpGo(d){if(H.i+d>=H.e.length)return closeHelp();H.i=Math.max(0,H.i+d);renderHelp();}
$('#helpNext').addEventListener('click',()=>helpGo(1));
$('#helpPrev').addEventListener('click',()=>helpGo(-1));
$('#helpClose').addEventListener('click',closeHelp);
let tx=null;const mb=$('#helpModal .mbox');
mb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
mb.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)helpGo(dx<0?1:-1);});

/* =====================================================================
   8. ADAPTATION PORTRAIT / PAYSAGE
   La taille du mot est calculée d'après l'espace RÉELLEMENT disponible :
   le plus grand possible, sans jamais dépasser ni couper un mot.
   ===================================================================== */
/* Les cursives (Marelle surtout) ont de très grandes boucles qui dépassent la ligne de texte.
   On mesure l'encre réelle du mot dans sa police et on lui réserve la place (marges en em),
   pour qu'aucune lettre ne soit coupée ni ne sorte de sa pastille. */
let ctxMesure=null;
function margesEncre(mot,L,pol){
  try{
    ctxMesure=ctxMesure||document.createElement('canvas').getContext('2d');
    const p=POLICES.find(x=>x.id===(pol||R.police))||POLICES[0];
    ctxMesure.font=p.poids+' 100px '+p.famille;
    const m=ctxMesure.measureText(mot);
    const fA=(m.fontBoundingBoxAscent||80)/100,fD=(m.fontBoundingBoxDescent||20)/100;
    const iA=(m.actualBoundingBoxAscent||0)/100,iD=(m.actualBoundingBoxDescent||0)/100;
    const base=(L-(fA+fD))/2+fA;                       // ligne de base, depuis le haut de la ligne
    return [Math.max(0,iA-base)+.04,Math.max(0,base+iD-L)+.04];
  }catch(e){return [.15,.15];}
}
function ajusterEncre(){
  $$('.liste-mots .lm',main).forEach(el=>{const m=margesEncre(el.textContent,1.3);el.style.padding=m[0]+'em 0 '+m[1]+'em';});
  $$('.police .pex',main).forEach(el=>{const m=margesEncre(el.textContent,1.25,el.parentElement.dataset.police);el.style.padding=m[0]+'em 0 '+m[1]+'em';});
}
function ajusterMot(){
  const fw=$('.flash-word',main);if(!fw)return;
  const mg=margesEncre(fw.textContent,1.3);fw.style.padding=mg[0]+'em 0 '+mg[1]+'em';
  const st=fw.parentElement,cs=getComputedStyle(st);
  const h=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let t=Math.max(28,Math.min(150,Math.floor(h*.6)));
  fw.style.fontSize=t+'px';
  while(t>22&&(fw.scrollWidth>fw.clientWidth+1||fw.scrollHeight>h+1)){t-=2;fw.style.fontSize=t+'px';}
}
function layout(){
  const W=innerWidth,Hh=innerHeight;
  document.body.classList.toggle('portrait',Hh>W*1.05);
  ajusterEncre();
  ajusterMot();
}
let lt=null;const ro=new ResizeObserver(()=>{cancelAnimationFrame(lt);lt=requestAnimationFrame(layout);});
ro.observe(document.body);
addEventListener('orientationchange',()=>setTimeout(layout,250));

ouverture();
renderHome();
})();
